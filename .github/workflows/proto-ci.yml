name: Proto CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: bufbuild/buf-setup-action@v1

      - uses: bufbuild/buf-lint-action@v1
        with:
          github_token: ${{ github.token }}

      # Only meaningful on a PR, where there's a base branch to diff against.
      # Compares the incoming change to main, not to any already-cut release tag
      # (those are immutable once a consumer has pinned them; see grpc-deps.yaml
      # in producer/consumer repos).
      - if: github.event_name == 'pull_request'
        uses: bufbuild/buf-breaking-action@v1
        with:
          against: "https://github.com/${{ github.repository }}.git#branch=${{ github.event.pull_request.base.ref }}"
          github_token: ${{ github.token }}
